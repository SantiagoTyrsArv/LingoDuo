<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aprende palabras en inglés con tarjetas interactivas y un mini-quiz.">
  <title>LingoDuo | Vocabulario</title>
  <!-- Primero los estilos comunes, luego los del módulo -->
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="vocabulario.css">
  <script src="vocabulario.js" defer></script>
</head>
<body>

  <!-- Encabezado común del proyecto -->
  <header class="encabezado">
    <a class="marca" href="../index.html" aria-label="LingoDuo, inicio">
      <span class="marca-simbolo" aria-hidden="true">LD</span>
      <span class="marca-texto"><strong>LingoDuo</strong><small>Inglés, a tu ritmo</small></span>
    </a>
    <nav class="menu" aria-label="Navegación principal">
      <a href="../index.html">Inicio</a>
      <a href="../numeros/numeros.html">Números</a>
      <a href="../vocabulario/vocabulario.html" aria-current="page">Palabras</a>
      <a href="../tobe/tobe.html">To Be</a>
    </nav>
  </header>

  <main class="contenedor">

    <!-- Sección de tarjetas de vocabulario -->
    <section class="seccion-vocab" aria-labelledby="titulo-vocab">
      <div class="cabecera-modulo">
        <p class="sobrelinea">RUTA 02 · PALABRAS DE CADA DÍA</p>
        <h1 id="titulo-vocab">Vocabulario básico</h1>
        <p class="instrucciones">Elige una categoría y voltea las tarjetas para descubrir su traducción.</p>
      </div>

      <!-- Botones de categoría (el JS marca cuál está activa) -->
      <div class="categorias" role="group" aria-label="Categorías de vocabulario">
        <button type="button" class="boton" data-categoria="colores">🎨 Colores</button>
        <button type="button" class="boton" data-categoria="animales">🐾 Animales</button>
        <button type="button" class="boton" data-categoria="familia">👨‍👩‍👧 Familia</button>
      </div>

      <!-- Aquí JavaScript genera las tarjetas -->
      <div id="tarjetas" class="grilla"></div>
    </section>

    <!-- Sección del mini-quiz -->
    <section class="quiz tarjeta" aria-labelledby="titulo-quiz">
      <h2 id="titulo-quiz">Mini-quiz</h2>

      <!-- Vista de preguntas -->
      <div id="quiz-juego">
        <p id="quiz-progreso" class="quiz-progreso"></p>
        <p class="quiz-pregunta">
          ¿Qué significa <strong id="quiz-palabra" lang="en"></strong>?
        </p>
        <div id="quiz-opciones" class="opciones"></div>
        <p id="quiz-retro" class="quiz-retro" aria-live="polite"></p>
        <button type="button" id="quiz-siguiente" class="boton" hidden>Siguiente</button>
      </div>

      <!-- Vista del resultado final -->
      <div id="quiz-resultado" class="quiz-resultado" hidden>
        <p id="quiz-puntaje" class="quiz-puntaje"></p>
        <p id="quiz-mensaje"></p>
        <button type="button" id="quiz-reiniciar" class="boton">Reiniciar quiz</button>
      </div>
    </section>

  </main>

  <footer class="pie">
    <div class="pie-contenido"><p><strong>LingoDuo</strong> · Aprende un poco. Avanza mucho.</p></div>
  </footer>

</body>
</html>
